dataset_root: ..
manifest_path: ../manifest_train.jsonl
output_dir: ./runs/video_to_lua_baseline_no_frame0_gru

data:
  num_video_frames: 3
  frame_indices: [31, 62, 93]
  image_size: 224
  max_param_text_chars: 4096
  max_lua_chars: 24000
  train_ratio: 0.8
  val_ratio: 0.1
  seed: 42

model:
  mode: retrieval_then_generation
  video_backbone: resnet18
  temporal_model: gru
  text_model_name: Salesforce/codet5p-220m
  freeze_video_backbone: false

train:
  task: effect_classification
  batch_size: 4
  num_workers: 2
  epochs: 5
  lr: 0.0001
  weight_decay: 0.01
  log_every: 20
  save_every_epoch: true

generation:
  max_source_length: 4096
  max_target_length: 4096
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
